name: RadulLiman
options:
  bundleIdPrefix: ru.geocamera
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.2"
    CURRENT_PROJECT_VERSION: "4"
targets:
  RadulLiman:
    type: application
    platform: iOS
    sources:
      - path: RadulLiman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.geocamera.app
        PRODUCT_NAME: RadulLiman
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
