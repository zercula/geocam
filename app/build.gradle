plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.geocamera.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.geocamera.app'
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName '2.2'
    }

    // Одна и та же подпись у всех сборок: новую версию можно ставить поверх старой
    // без удаления приложения и без потери снимков. Это учебный ключ, не для магазина.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
